name: Build and Release Remaster App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: |
          pip install Pillow

      - name: Generate App Icon
        run: |
          python - << 'EOF'
          import os
          from PIL import Image, ImageDraw
          os.makedirs('src/common', exist_ok=True)
          img = Image.new('RGB', (192, 192), color='#007AFF')
          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle((0, 0, 192, 192), radius=40, fill='#1C1C1E')
          draw.text((96, 96), "15", fill='#FFFFFF', anchor="mm", font_size=90)
          
          # Сохраняем под обоими возможными именами для manifest.json
          img.save('src/common/icon.png')
          img.save('src/common/logo.png')
          print("Иконки icon.png и logo.png успешно созданы!")
          EOF

      - name: Install and Build Remaster
        run: |
          npm install
          mkdir -p sign/release
          openssl req -x509 -nodes -days 3650 -newkey rsa:2048 -keyout sign/release/private.pem -out sign/release/certificate.pem -subj "/CN=localhost"
          npx aiot release
          mkdir -p dist_output
          find dist/ -name "*.rpk" -not -path "*/node_modules/*" -exec cp {} dist_output/remaster.rpk \;

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpk-binaries
          path: dist_output/
