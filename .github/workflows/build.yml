name: Build RPK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Icon
        run: |
          mkdir -p src/common src/pages/index
          pip install Pillow
          python3 -c "from PIL import Image, ImageDraw; img = Image.new('RGBA', (192, 192), (0, 110, 245, 255)); draw = ImageDraw.Draw(img); mask = Image.new('L', (192, 192), 0); mask_draw = ImageDraw.Draw(mask); mask_draw.rounded_rectangle([(0, 0), (192, 192)], radius=45, fill=255); img.putalpha(mask); draw.text((96, 93), '15', fill=(255, 255, 255, 255), anchor='mm', font_size=85, font_style='bold'); img.save('src/common/logo.png')"

      - name: Fix Code and Configs
        run: |
          rm -f src/pages/index/index.js
          echo '{"name":"myapp","version":"1.2.0","private":true,"scripts":{"build":"aiot build","release":"aiot release"},"devDependencies":{"aiot-toolkit":"2.0.5"}}' > package.json
          echo '<script>export default { onCreate() {} }</script>' > src/app.ux

      - name: Build RPK
        run: |
          npm install
          mkdir -p sign/release
          openssl req -x509 -nodes -days 3650 -newkey rsa:2048 -keyout sign/release/private.pem -out sign/release/certificate.pem -subj "/CN=localhost"
          npx aiot release
          mkdir -p dist_output
          find dist/ -name "*.rpk" -not -path "*/node_modules/*" -exec cp {} dist_output/remaster.rpk \;
