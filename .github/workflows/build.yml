name: Build RPK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Generate High-Quality Designer Icon
        run: |
          mkdir -p src/common
          pip install Pillow
          python3 -c "
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new('RGBA', (192, 192), (0, 110, 245, 255))
          draw = ImageDraw.Draw(img)
          mask = Image.new('L', (192, 192), 0)
          mask_draw = ImageDraw.Draw(mask)
          mask_draw.rounded_rectangle([(0, 0), (192, 192)], radius=45, fill=255)
          img.putalpha(mask)
          draw.text((96, 93), '15', fill=(255, 255, 255, 255), anchor='mm', font_size=85, font_style='bold')
          img.save('src/common/logo.png')
          "
          echo "Иконка готова!"

      - name: Inject Safe App Code (UX and JS)
        run: |
          mkdir -p src/pages/index
          
          # 1. Манифест приложения
          cat << 'EOF' > src/manifest.json
          {
            "package": "com.soldatov.fifteen.remaster",
            "name": "Ремастер",
            "versionName": "1.0.0",
            "versionCode": 1,
            "minPlatformVersion": 1000,
            "icon": "/common/logo.png",
            "deviceTypeList": ["band", "watch"],
            "features": [
              { "name": "system.router" },
              { "name": "system.vibrator" }
            ],
            "config": {
              "logLevel": "log",
              "designWidth": 212
            },
            "router": {
              "entry": "pages/index",
              "pages": {
                "pages/index": {
                  "component": "index"
                }
              }
            }
          }
          EOF

          # 2. Безопасный интерфейс на чистых CSS классах
          cat << 'EOF' > src/pages/index/index.ux
          <template>
            <div class="container {{themeClass}}">
              <!-- ИГРОВОЕ ПОЛЕ -->
              <div class="board">
                <div for="{{gameMatrix}}" class="cell-wrapper">
                  <input 
                    if="{{$item !== 0}}" 
                    type="button" 
                    class="cell {{animClass}} {{tileColorClass}}" 
                    value="{{$item}}" 
                    onclick="moveTile($idx)"
                  />
                </div>
              </div>
              
              <!-- НАСТРОЙКИ -->
              <div class="menu">
                <text class="menu-title">Настройки</text>
                <input type="button" class="btn" value="Тема: {{isDark ? 'Темная' : 'Светлая'}}" onclick="toggleTheme" />
                <input type="button" class="btn" value="Цвет: {{tileStyle === 0 ? 'Стиль 1' : 'Стиль 2'}}" onclick="toggleColor" />
                <input type="button" class="btn" value="Анимация: {{isAnim ? 'ВКЛ' : 'ВЫКЛ'}}" onclick="toggleAnim" />
                <input type="button" class="btn" value="Вибро: {{isVib ? 'ВКЛ' : 'ВЫКЛ'}}" onclick="toggleVib" />
              </div>
              
              <!-- АВТОР -->
              <div class="credits">
                <text class="credits-label">Создал</text>
                <text class="credits-name">Александр Солдатов</text>
              </div>
            </div>
          </template>

          <style>
            /* Базовые стили */
            .container { flex-direction: column; align-items: center; width: 212px; padding-top: 30px; padding-bottom: 30px; }
            .board { width: 184px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
            .cell-wrapper { width: 43px; height: 43px; margin: 1.5px; justify-content: center; align-items: center; }
            .cell { width: 43px; height: 43px; border-radius: 6px; font-size: 18px; font-weight: bold; }
            .anim { transition: all 0.15s ease-in-out; }
            .menu { flex-direction: column; align-items: center; width: 180px; margin-top: 10px; }
            .menu-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
            .btn { width: 170px; height: 35px; border-radius: 6px; font-size: 14px; margin-bottom: 8px; }
            .credits { flex-direction: column; align-items: center; margin-top: 25px; width: 180px; }
            .credits-label { font-size: 12px; color: #8E8E93; }
            .credits-name { font-size: 15px; color: #FFD700; font-weight: bold; margin-top: 2px; }

            /* Стили ТЕМНЫЙ режим */
            .theme-dark { background-color: #000000; }
            .theme-dark .menu-title { color: #FFFFFF; }
            .theme-dark .btn { background-color: #222222; color: #FFFFFF; }
            .theme-dark .tile-style0 { background-color: #1C1C1E; color: #FFFFFF; }
            .theme-dark .tile-style1 { background-color: #007AFF; color: #FFFFFF; }

            /* Стили СВЕТЛЫЙ режим */
            .theme-light { background-color: #FFFFFF; }
            .theme-light .menu-title { color: #000000; }
            .theme-light .btn { background-color: #E5E5EA; color: #000000; }
            .theme-light .tile-style0 { background-color: #D1D1D6; color: #000000; }
            .theme-light .tile-style1 { background-color: #34C759; color: #000000; }
          </style>

          <script src="./index.js"></script>
          EOF

          # 3. Чистая логика переключения классов
          cat << 'EOF' > src/pages/index/index.js
          import vibrator from '@system.vibrator'
          export default {
            private: {
              gameMatrix:,
              emptyIndex: 15,
              isDark: true,
              tileStyle: 0,
              isAnim: true,
              isVib: true,
              themeClass: 'theme-dark',
              tileColorClass: 'tile-style0',
              animClass: 'anim'
            },
            onCreate() {
              this.shuffle();
              this.updateClasses();
            },
            shuffle() {
              let arr =;
              for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                let temp = arr[i]; arr[i] = arr[j]; arr[j] = temp;
              }
              this.gameMatrix = arr;
              for (let i = 0; i < arr.length; i++) {
                if (arr[i] === 0) { this.emptyIndex = i; break; }
              }
            },
            moveTile(index) {
              const r1 = Math.floor(index / 4), c1 = index % 4;
              const r2 = Math.floor(this.emptyIndex / 4), c2 = this.emptyIndex % 4;
              if ((Math.abs(r1 - r2) + Math.abs(c1 - c2)) === 1) {
                let newBoard = [];
                for (let i = 0; i < this.gameMatrix.length; i++) { newBoard.push(this.gameMatrix[i]); }
                newBoard[this.emptyIndex] = newBoard[index]; newBoard[index] = 0;
                this.gameMatrix = newBoard; this.emptyIndex = index;
                this.triggerVibe();
              }
            },
            triggerVibe() {
              if (this.isVib) { try { vibrator.vibrate({ mode: 'short' }); } catch(e){} }
            },
            updateClasses() {
              this.themeClass = this.isDark ? 'theme-dark' : 'theme-light';
              this.tileColorClass = this.tileStyle === 0 ? 'tile-style0' : 'tile-style1';
              this.animClass = this.isAnim ? 'anim' : '';
            },
            toggleTheme() { this.isDark = !this.isDark; this.triggerVibe(); this.updateClasses(); },
            toggleColor() { this.tileStyle = this.tileStyle === 0 ? 1 : 0; this.triggerVibe(); this.updateClasses(); },
            toggleAnim() { this.isAnim = !this.isAnim; this.triggerVibe(); this.updateClasses(); },
            toggleVib() { this.isVib = !this.isVib; this.triggerVibe(); }
          }
          EOF
          echo "Код без динамических стилей успешно зашит!"

      - name: Install and Build (True Release Sign Mode)
        run: |
          npm install
          mkdir -p sign/release
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout sign/release/private.pem -out sign/release/certificate.pem -subj "/CN=localhost"
          npx aiot release
          mkdir -p dist_output
          find dist/ -name "*.rpk" -not -path "*/node_modules/*" -exec cp {} dist_output/remaster.rpk \;
          
      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: dist_output/remaster.rpk
          if-no-files-found: error
