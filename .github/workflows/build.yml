name: Build RPK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Download High-Quality Icon (Blue 15)
        run: |
          # Автоматически создаем папку common и скачиваем туда готовую синюю иконку "15"
          mkdir -p src/common
          curl -sL "https://placehold.co" -o src/common/logo.png
          echo "Иконка '15' успешно добавлена в проект!"
          
      - name: Install and Build (Release Mode)
        run: |
          npm install
          mkdir -p sign/release
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout sign/release/private.pem -out sign/release/certificate.pem -subj "/CN=localhost"
          npx aiot release
          mkdir -p dist_output
          find dist/ -name "*.rpk" -not -path "*/node_modules/*" -exec cp {} dist_output/remaster.rpk \;
          
      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: dist_output/remaster.rpk
          if-no-files-found: error
