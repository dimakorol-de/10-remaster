name: Build RPK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Valid App Structure
        run: |
          mkdir -p src/common
          mkdir -p src/pages/index
          
          # Скачиваем обязательную заглушку иконки
          curl -sL https://placehold.co -o src/common/logo.png
          
          # Записываем базовый UX-код без сложных функций, которые ломали UxLoader
          cat << 'EOF' > src/pages/index/index.ux
          <template>
            <div class="container">
              <text class="title">Пятнашки Ремастер</text>
              <text class="author">Создал Александр Солдатов</text>
            </div>
          </template>
          <style>
            .container { flex-direction: column; align-items: center; width: 212px; padding-top: 100px; background-color: #000000; }
            .title { font-size: 24px; color: #ffffff; margin-bottom: 20px; }
            .author { font-size: 16px; color: #ffd700; }
          </style>
          <script>
            export default {
              private: {}
            }
          </script>
          EOF

      - name: Install and Build
        run: |
          npm install
          npx aiot build
          mkdir -p dist_output
          find dist/ -name "*.rpk" -not -path "*/node_modules/*" -exec cp {} dist_output/ \;
          
      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: dist_output/*.rpk
          if-no-files-found: error
