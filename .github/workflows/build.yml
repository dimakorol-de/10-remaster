name: Build RPK
on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Unpack and Build Vela Project
        run: |
          # Распаковываем чистый проект
          unzip -o fifteen_remaster_v3.zip
          
          # Установка и компиляция
          npm install
          npx aiot build
          
          # Создаем чистую папку для готового файла
          mkdir -p output_rpk
          find dist/ -name "*.rpk" -not -path "*/node_modules/*" -exec cp {} output_rpk/ \;
          
      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: output_rpk/*.rpk
          if-no-files-found: error
