name: Build RPK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Hard Reset Cache
        run: |
          echo "Очистка структуры под стандарты инструкции..."
          rm -rf ~/.npm node_modules dist build src package.json
          mkdir -p src/common src/pages/index
          
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Icon (logo.png)
        run: |
          pip install Pillow
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGBA', (192, 192), (0, 110, 245, 255))
          draw = ImageDraw.Draw(img)
          mask = Image.new('L', (192, 192), 0)
          mask_draw = ImageDraw.Draw(mask)
          mask_draw.rounded_rectangle([(0, 0), (192, 192)], radius=45, fill=255)
          img.putalpha(mask)
          draw.text((96, 93), '15', fill=(255, 255, 255, 255), anchor='mm', font_size=85, font_style='bold')
          img.save('src/common/logo.png')
          "

      - name: Inject Safe App Code (Strict Guide Compliance)
        run: |
          # 1. package.json по инструкции
          cat << 'EOF' > package.json
          {
            "name": "myapp",
            "version": "1.0.0",
            "private": true,
            "scripts": { 
              "build": "aiot build", 
              "release": "aiot release" 
            },
            "devDependencies": { 
              "aiot-toolkit": "2.0.5" 
            }
          }
          EOF
          
          # 2. src/app.ux по инструкции
          cat << 'EOF' > src/app.ux
          <script>
          export default {
            onCreate() {}
          }
          </script>
          EOF
          
          # 3. manifest.json с поддержкой band и watch
          cat << 'EOF' > src/manifest.json
          {
            "package": "com.example.fifteenpuzzle",
            "name": "Ремастер",
            "versionName": "1.0.0",
            "versionCode": 1,
            "minPlatformVersion": 1000,
            "icon": "/common/logo.png",
            "deviceTypeList": ["band","watch"],
            "features": [
              { "name": "system.router" },
              { "name": "system.vibrator" }
            ],
            "config": { 
              "logLevel": "log", 
              "designWidth": 212 
            },
            "router": {
              "entry": "pages/index",
              "pages": {
                "pages/index": { 
                  "component": "index" 
                }
              }
            }
          }
          EOF

          # 4. Монолитный код игры 4х4 с копирайтом ВНУТРИ меню настроек
          cat << 'EOF' > src/pages/index/index.ux
          <template>
            <div class="container">
              <text class="title">Пятнашки 4x4</text>
              
              <!-- ИГРОВОЕ ПОЛЕ -->
              <div class="board">
                <div for="{{gameMatrix}}" class="cell-wrapper">
                  <input 
                    if="{{$item !== 0}}" 
                    type="button" 
                    class="cell" 
                    value="{{$item}}" 
                    onclick="moveTile($idx)"
                  />
                </div>
              </div>
              
              <!-- НАСТРОЙКИ С КОПИРАЙТОМ ВНУТРИ -->
              <div class="menu">
                <text class="menu-title">Настройки</text>
                <input type="button" class="btn" value="Тема: {{isDark ? 'Темная' : 'Светлая'}}" onclick="toggleTheme" />
                <input type="button" class="btn" value="Цвет: {{tileStyle === 0 ? 'Стиль 1' : 'Стиль 2'}}" onclick="toggleColor" />
                <input type="button" class="btn" value="Вибро: {{isVib ? 'ВКЛ' : 'ВЫКЛ'}}" onclick="toggleVib" />
                
                <!-- Копирайт перенесен сюда, как часть меню -->
                <div class="credits">
                  <text class="credits-label">Создал</text>
                  <text class="credits-name">Александр Солдатов</text>
                </div>
              </div>
            </div>
          </template>

          <style>
            .container { flex-direction: column; align-items: center; width: 212px; background-color: #000000; padding-top: 15px; padding-bottom: 15px; }
            .title { font-size: 18px; color: #FFFFFF; margin-bottom: 8px; font-weight: bold; }
            
            .board { width: 184px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
            .cell-wrapper { width: 43px; height: 43px; margin: 1.5px; justify-content: center; align-items: center; }
            .cell { width: 43px; height: 43px; border-radius: 6px; font-size: 18px; font-weight: bold; background-color: #007AFF; color: #FFFFFF; }
            
            .menu { flex-direction: column; align-items: center; width: 180px; margin-top: 5px; }
            .menu-title { font-size: 15px; color: #FFFFFF; font-weight: bold; margin-bottom: 4px; }
            .btn { width: 170px; height: 28px; border-radius: 5px; font-size: 13px; margin-bottom: 5px; background-color: #222222; color: #FFFFFF; }
            
            /* Сжатый аккуратный копирайт внутри блока меню */
            .credits { flex-direction: column; align-items: center; margin-top: 4px; width: 180px; }
            .credits-label { font-size: 11px; color: #8E8E93; }
            .credits-name { font-size: 13px; color: #FFD700; font-weight: bold; margin-top: 1px; }
          </style>

          <script>
            import vibrator from '@system.vibrator'
            
            export default {
              private: {
                gameMatrix: [],
                isDark: true,
                tileStyle: 0,
                isVib: true
              },
              onInit() {
                let arr = [];
                for (let i = 1; i <= 15; i++) {
                  arr.push(i);
                }
                arr.push(0);
                arr.sort(function() { return Math.random() - 0.5; });
                this.gameMatrix = arr;
              },
              moveTile(index) {
                let emptyIndex = this.gameMatrix.indexOf(0);
                let r1 = Math.floor(index / 4), c1 = index % 4;
                let r2 = Math.floor(emptyIndex / 4), c2 = emptyIndex % 4;
                if ((Math.abs(r1 - r2) + Math.abs(c1 - c2)) === 1) {
                  let newBoard = [...this.gameMatrix];
                  newBoard[emptyIndex] = newBoard[index];
                  newBoard[index] = 0;
                  this.gameMatrix = newBoard;
                  if (this.isVib) {
                    try {
                      vibrator.vibrate({ mode: 'short' });
                    } catch(e) {}
                  }
                }
              },
              toggleTheme() { this.isDark = !this.isDark; },
              toggleColor() { this.tileStyle = this.tileStyle === 0 ? 1 : 0; },
              toggleVib() { this.isVib = !this.isVib; }
            }
          </script>
          EOF
          echo "Код со стабильной инициализацией и копирайтом в меню зашит!"

      - name: Install and Build (Strict Release Mode)
        run: |
          npm install
          mkdir -p sign/release
          openssl req -x509 -nodes -days 3650 -newkey rsa:2048 -keyout sign/release/private.pem -out sign/release/certificate.pem -subj "/CN=localhost"
          npx aiot release
          mkdir -p dist_output
          find dist/ -name "*.rpk" -not -path "*/node_modules/*" -exec cp {} dist_output/remaster.rpk \;
          
      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: dist_output/remaster.rpk
