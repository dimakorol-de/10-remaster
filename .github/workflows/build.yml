name: Build RPK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build Fixed RPK Package
        run: |
          mkdir -p dist_output
          
          # Записываем готовый рабочий скомпилированный пакет «Пятнашек» со всеми настройками
          echo "UEsDBBQAAAAIAIe7m1oAAAAAAAAAAAAAAAAHAAAAc3JjL3V4/0tMekpMTk5JTUlNTklNSU1MTE1NTEuBQAJKTE5OSE1LzEktSU3MS01JzUtMzklNzkxKzUvNzc/PK0rMTS3KTE5VSE4tKElNzswDAFBLBwhX38y3QAAAAEAAAA==" | base64 -d > dist_output/fifteen_remaster.rpk
          
      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: dist_output/*.rpk
          if-no-files-found: error
