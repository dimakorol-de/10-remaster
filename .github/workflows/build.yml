name: Build RPK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Icon
        run: |
          mkdir -p src/common src/pages/index
          pip install Pillow
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGBA', (192, 192), (0, 110, 245, 255))
          draw = ImageDraw.Draw(img)
          mask = Image.new('L', (192, 192), 0)
          mask_draw = ImageDraw.Draw(mask)
          mask_draw.rounded_rectangle([(0, 0), (192, 192)], radius=45, fill=255)
          img.putalpha(mask)
          draw.text((96, 93), '15', fill=(255, 255, 255, 255), anchor='mm', font_size=85, font_style='bold')
          img.save('src/common/logo.png')
          "

      - name: Inject Configuration
        run: |
          cat << 'EOF' > package.json
          {
            "name": "myapp",
            "version": "1.0.0",
            "private": true,
            "scripts": { "build": "aiot build", "release": "aiot release" },
            "devDependencies": { "aiot-toolkit": "2.0.5" }
          }
          EOF
          
          cat << 'EOF' > src/app.ux
          <script>export default { onCreate() {} }</script>
          EOF
          
          cat << 'EOF' > src/manifest.json
          {
            "package": "com.example.fifteenpuzzle",
            "name": "Ремастер",
            "versionName": "1.0.1",
            "versionCode": 2,
            "minPlatformVersion": 1000,
            "icon": "/common/logo.png",
            "deviceTypeList": ["band","watch"],
            "features": [
              { "name": "system.router" },
              { "name": "system.vibrator" }
            ],
            "config": { "logLevel": "log", "designWidth": 212 },
            "router": {
              "entry": "pages/index",
              "pages": { "pages/index": { "component": "index" } }
            }
          }
          EOF

      - name: Inject Short UX Game File
        run: |
          cat << 'EOF' > src/pages/index/index.ux
          <template>
            <div class="container" style="background-color: {{isWin ? '#FFD700' : (isDark ? '#000000' : '#F2F2F7')}};">
              
              <!-- ЭКРАН ПОБЕДЫ -->
              <div if="{{isWin}}" class="box">
                <text class="win-title">ПОБЕДА!</text>
                <text class="win-subtitle">Игра успешно собрана!</text>
                <input type="button" class="btn win-btn" value="🎮 Играть снова" onclick="restartGame" />
                <div class="credits"><text class="c-label" style="color: #000000;">Создал</text><text class="c-name" style="color: #000000;">Александр Солдатов</text></div>
              </div>

              <!-- ЭКРАН ИГРЫ -->
              <div if="{{!showSettings && !isWin}}" class="box">
                <text class="title" style="color: {{isDark ? '#FFFFFF' : '#000000'}};">Пятнашки 4x4</text>
                <div class="board">
                  <div for="{{gameMatrix}}" class="cell-wrapper">
                    <input if="{{$item !== 0}}" type="button" class="cell" style="background-color: {{tileStyle === 0 ? (isDark ? '#1C1C1E' : '#E5E5EA') : (isDark ? '#007AFF' : '#34C759')}}; color: {{isDark ? '#FFFFFF' : '#000000'}};" value="{{$item}}" onclick="moveTile($idx)" />
                  </div>
                </div>
                <div class="game-menu">
                  <input type="button" class="btn half-btn" value="💡 Автоход" onclick="makeAutoMove" />
                  <input type="button" class="btn half-btn" value="⚙ Меню" onclick="toMenu" />
                </div>
              </div>

              <!-- ЭКРАН НАСТРОЕК -->
              <div if="{{showSettings && !isWin}}" class="box">
                <text class="title" style="color: {{isDark ? '#FFFFFF' : '#000000'}};">Настройки</text>
                <input type="button" class="btn" value="Тема: {{isDark ? '● Темная' : '○ Светлая'}}" onclick="toggleTheme" />
                <input type="button" class="btn" value="Цвет: {{tileStyle === 0 ? 'Стиль 1' : 'Стиль 2'}}" onclick="toggleColor" />
                <input type="button" class="btn" value="Вибро: {{isVib ? '☑ ВКЛ' : '☒ ВЫКЛ'}}" onclick="toggleVib" />
                <input type="button" class="btn" style="background-color: #007AFF; color: #FFFFFF;" value="◀ Назад" onclick="toGame" />
                <div class="credits"><text class="c-label">Создал</text><text class="c-name">Александр Солдатов</text></div>
              </div>

            </div>
          </template>
          <style>
            .container { flex-direction: column; align-items: center; width: 212px; height: 490px; padding: 15px 0; }
            .box { flex-direction: column; align-items: center; width: 212px; }
            .title { font-size: 18px; margin-bottom: 12px; font-weight: bold; }
            .win-title { font-size: 28px; color: #000000; font-weight: bold; margin-top: 40px; margin-bottom: 5px; }
            .win-subtitle { font-size: 14px; color: #333333; margin-bottom: 40px; font-weight: 500; }
            .board { width: 184px; flex-wrap: wrap; justify-content: center; margin-bottom: 15px; }
            .cell-wrapper { width: 43px; height: 43px; margin: 1.5px; justify-content: center; align-items: center; }
            .cell { width: 43px; height: 43px; border-radius: 8px; font-size: 18px; font-weight: bold; }
            .game-menu { width: 184px; justify-content: space-between; }
            .btn { width: 170px; height: 32px; border-radius: 6px; font-size: 14px; margin-bottom: 8px; background-color: #222222; color: #FFFFFF; }
            .half-btn { width: 88px; height: 32px; font-size: 13px; }
            .win-btn { background-color: #000000; color: #FFFFFF; }
            .credits { flex-direction: column; align-items: center; margin-top: 20px; }
            .c-label { font-size: 11px; color: #8E8E93; }
            .c-name { font-size: 13px; color: #FFD700; font-weight: bold; }
          </style>
          <script>
            import vibrator from '@system.vibrator'
            export default {
              private: { gameMatrix: [], movesHistory: [], isDark: true, tileStyle: 0, isVib: true, showSettings: false, isWin: false },
              onInit() { this.restartGame(); },
              restartGame() {
                this.isWin = false; this.showSettings = false; this.movesHistory = [];
                let arr =;
                let emptyIndex = 15;
                
                // Честное перемешивание ходами, чтобы бот мог распутать обратно 100% без ошибок
                for (let k = 0; i < 60; i++) {
                  let r = Math.floor(emptyIndex / 4), c = emptyIndex % 4;
                  let validMoves = [];
                  if (r > 0) validMoves.push(emptyIndex - 4);
                  if (r < 3) validMoves.push(emptyIndex + 4);
                  if (c > 0) validMoves.push(emptyIndex - 1);
                  if (c < 3) validMoves.push(emptyIndex + 1);
                  
                  let nextMove = validMoves[Math.floor(Math.random() * validMoves.length)];
                  arr[emptyIndex] = arr[nextMove]; arr[nextMove] = 0;
                  this.movesHistory.push(emptyIndex); // Запоминаем куда должен встать пустой
                  emptyIndex = nextMove;
                }
                this.gameMatrix = arr;
              },
              moveTile(index) {
                if (this.isWin) return;
                let emptyIndex = this.gameMatrix.indexOf(0);
                if ((Math.abs(Math.floor(index/4) - Math.floor(emptyIndex/4)) + Math.abs((index%4) - (emptyIndex%4))) === 1) {
                  let newBoard = [...this.gameMatrix]; newBoard[emptyIndex] = newBoard[index]; newBoard[index] = 0;
                  this.gameMatrix = newBoard; this.triggerVibe('short'); this.checkWin();
                }
              },
              makeAutoMove() {
                if (this.isWin || this.movesHistory.length === 0) return;
                let targetEmptyIndex = this.movesHistory.pop(); // Берем последний ход назад
                let currentEmptyIndex = this.gameMatrix.indexOf(0);
                
                let newBoard = [...this.gameMatrix];
                newBoard[currentEmptyIndex] = newBoard[targetEmptyIndex];
                newBoard[targetEmptyIndex] = 0;
                this.gameMatrix = newBoard;
                this.triggerVibe('short');
                this.checkWin();
              },
              checkWin() {
                for (let i = 0; i < 15; i++) { if (this.gameMatrix[i] !== (i + 1)) return; }
                this.isWin = true; this.triggerVibe('long');
              },
              triggerVibe(mode) { if (this.isVib) { try { vibrator.vibrate({ mode: mode }); } catch(e) {} } },
              toMenu() { this.showSettings = true; },
              toGame() { this.showSettings = false; },
              toggleTheme() { this.isDark = !this.isDark; },
              toggleColor() { this.tileStyle = this.tileStyle === 0 ? 1 : 0; },
              toggleVib() { this.isVib = !this.isVib; }
            }
          </script>
          EOF
          echo "Код умного автосборщика успешно зашит!"

      - name: Build Project
        run: |
          npm install
          mkdir -p sign/release
          openssl req -x509 -nodes -days 3650 -newkey rsa:2048 -keyout sign/release/private.pem -out sign/release/certificate.pem -subj "/CN=localhost"
          npx aiot release
          mkdir -p dist_output
          find dist/ -name "*.rpk" -not -path "*/node_modules/*" -exec cp {} dist_output/remaster.rpk \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: dist_output/remaster.rpk
