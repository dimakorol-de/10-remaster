name: Build RPK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate Icon
        run: mkdir -p src/common src/pages/index; pip install Pillow; python3 -c "from PIL import Image, ImageDraw; img = Image.new('RGBA', (192, 192), (0, 110, 245, 255)); draw = ImageDraw.Draw(img); mask = Image.new('L', (192, 192), 0); mask_draw = ImageDraw.Draw(mask); mask_draw.rounded_rectangle([(0, 0), (192, 192)], radius=45, fill=255); img.putalpha(mask); draw.text((96, 93), '15', fill=(255, 255, 255, 255), anchor='mm', font_size=85, font_style='bold'); img.save('src/common/logo.png')"
      - name: Inject Configuration
        run: echo '{"name":"myapp","version":"1.2.0","private":true,"scripts":{"build":"aiot build","release":"aiot release"},"devDependencies":{"aiot-toolkit":"2.0.5"}}' > package.json; echo '<script>export default { onCreate() {} }</script>' > src/app.ux; echo '{"package":"com.example.fifteenpuzzle","name":"Пятнашки","versionName":"1.2.0","versionCode":3,"minPlatformVersion":1000,"icon":"/common/logo.png","deviceTypeList":["band","watch"],"features":[{"name":"system.router"},{"name":"system.vibrator"},{"name":"system.storage"}],"config":{"logLevel":"log","designWidth":212},"router":{"entry":"pages/index","pages":{"pages/index":{"component":"index"}}}}' > src/manifest.json
      - name: Inject UX Game File
        run: |
          cat << 'EOF' > src/pages/index/index.ux
          <template><div class="container {{isWin?'victory-bg-anim':''}}" style="background-color:{{isWin?'#FFD700':(isDark?'#000000':'#F2F2F7')}};"><div if="{{isWin}}" class="box"><text class="win-title">ПОБЕДА!</text><text class="win-subtitle" style="color:{{isDark?'#FFFFFF':'#000000'}};">Игра успешно собрана!</text><text class="record-text" style="color:{{isDark?'#FFFFFF':'#000000'}};">Рекорд: {{bestMoves}}х / {{bestTime}}с</text><input type="button" class="btn win-btn" value="🎮 Играть снова" onclick="restartGame"/><div class="credits"><text class="c-label" style="color:#8E8E93;">Создал</text><text class="c-name" style="color:#000000;">Александр Солдатов</text></div></div><div if="{{!showSettings && !isWin}}" class="box"><div class="stats-row"><text class="stats-text" style="color:{{isDark?'#FFFFFF':'#000000'}};">⏱ {{formattedTime}}</text><text class="stats-text" style="color:{{isDark?'#FFFFFF':'#000000'}};">👣 {{moves}}</text></div><text class="title" style="color:{{isDark?'#FFFFFF':'#000000'}};">Пятнашки {{gridSize}}x{{gridSize}}</text><div class="board" style="width:184px;"><div for="{{(idx,item) in gameMatrix}}" class="cell-wrapper" style="width:{{cellSizePx}}px;height:{{cellSizePx}}px;margin:1.5px;"><input if="{{item!==0}}" type="button" class="cell {{isAnim?'anim':''}} {{isWin?'victory-tile-anim':''}}" style="background-color:{{tileStyle===0?(isDark?'#1C1C1E':'#E5E5EA'):(isDark?'#007AFF':'#34C759')}};color:{{isDark?'#FFFFFF':'#000000'}};width:{{cellSizePx}}px;height:{{cellSizePx}}px;font-size:{{fontSizePx}}px;" value="{{item}}" onclick="moveTile(idx)"/></div></div><div class="game-menu"><input type="button" class="btn half-btn" value="{{autoPlaying?'■ Стоп':'💡 Автоход'}}" onclick="toggleAutoRun"/><input type="button" class="btn half-btn" value="⚙ Меню" onclick="toMenu"/></div></div><div if="{{showSettings && !isWin}}" class="box"><text class="title" style="color:{{isDark?'#FFFFFF':'#000000'}};">Настройки</text><input type="button" class="btn" style="background-color:{{isDark?'#222222':'#E5E5EA'}};color:{{isDark?'#FFFFFF':'#000000'}};" value="Режим: {{gridSize}}x{{gridSize}}" onclick="cycleGridSize"/><input type="button" class="btn" style="background-color:{{isDark?'#222222':'#E5E5EA'}};color:{{isDark?'#FFFFFF':'#000000'}};" value="Тема: {{isDark?'● Темная':'○ Светлая'}}" onclick="toggleTheme"/><input type="button" class="btn" style="background-color:{{isDark?'#222222':'#E5E5EA'}};color:{{isDark?'#FFFFFF':'#000000'}};" value="Цвет: {{tileStyle===0?'Стиль 1':'Стиль 2'}}" onclick="toggleColor"/><input type="button" class="btn" style="background-color:{{isDark?'#222222':'#E5E5EA'}};color:{{isDark?'#FFFFFF':'#000000'}};" value="Вибро: {{isVib?'☑ ВКЛ':'☒ ВЫКЛ'}}" onclick="toggleVib"/><input type="button" class="btn" style="background-color:#007AFF;color:#FFFFFF;" value="◀ Назад" onclick="toGame"/><div class="credits"><text class="c-label">Создал</text><text class="c-name">Александр Солдатов</text></div></div></div></template>
          <style>.container{flex-direction:column;align-items:center;width:212px;height:490px;padding:25px 0;transition:background-color .4s ease}.box{flex-direction:column;align-items:center;width:212px}.stats-row{width:184px;justify-content:space-between;margin-bottom:4px;padding:0 5px}.stats-text{font-size:15px;font-weight:bold}.title{font-size:16px;margin-bottom:10px;font-weight:bold}.win-title{font-size:28px;color:#000;font-weight:bold;margin-top:30px;margin-bottom:5px}.win-subtitle{font-size:14px;margin-bottom:10px;font-weight:500}.record-text{font-size:13px;font-weight:bold;margin-bottom:25px}.board{flex-wrap:wrap;justify-content:center;margin-bottom:12px}.cell-wrapper{justify-content:center;align-items:center}.cell{border-radius:8px;font-weight:bold}.anim{transition:transform .22s cubic-bezier(.175,.885,.32,1.275),background-color .3s ease}.game-menu{width:184px;justify-content:space-between}.btn{width:170px;height:35px;border-radius:8px;font-size:15px;margin-bottom:6px;background-color:#222;color:#FFFFFF;transition:transform .1s}.btn:active{transform:scale(.96);opacity:.85}.half-btn{width:88px;height:35px;font-size:14px}.win-btn{background-color:#000;color:#FFFFFF;font-weight:bold}.credits{flex-direction:column;align-items:center;margin-top:15px}.c-label{font-size:11px;color:#8E8E93}.c-name{font-size:13px;color:#FFD700;font-weight:bold}.victory-tile-anim{animation-name:pulse-gold;animation-duration:1.5s;animation-iteration-count:infinite}@keyframes pulse-gold{0%{transform:scale(1)}50%{transform:scale(1.04);background-color:#FFFFFF;color:#000000}100%{transform:scale(1)}}.victory-bg-anim{animation-name:victory-bg;animation-duration:3s;animation-iteration-count:1}@keyframes victory-bg{0%{background-color:#000000}50%{background-color:#1c3d1c}100%{background-color:#FFD700}}</style>
          <script>
          import vibrator from '@system.vibrator'
          import storage from '@system.storage'
          export default {
            private: { gameMatrix: [], movesHistory: [], gridSize: 4, moves: 0, timerSeconds: 0, timerId: null, isDark: true, tileStyle: 0, isVib: true, showSettings: false, isWin: false, isAnim: true, autoPlaying: false, autoTimerId: null, bestMoves: '-', bestTime: '-' },
            computed: {
              formattedTime() { const m = Math.floor(this.timerSeconds / 60).toString().padStart(2, '0'); const s = (this.timerSeconds % 60).toString().padStart(2, '0'); return `${m}:${s}`; },
              cellSizePx() { if (this.gridSize === 3) return 58; if (this.gridSize === 5) return 33; return 43; },
              fontSizePx() { if (this.gridSize === 3) return 26; if (this.gridSize === 5) return 16; return 20; }
            },
            onInit() { this.loadRecords(); this.restartGame(); },
            onDestroy() { this.stopTimer(); this.stopAutoRun(); },
            restartGame() {
              this.isWin = false; this.showSettings = false; this.movesHistory = []; this.moves = 0; this.timerSeconds = 0; this.stopTimer(); this.stopAutoRun(); let totalCells = this.gridSize * this.gridSize; let arr = Array.from({length: totalCells}, (v, i) => (i + 1) % totalCells); let emptyIndex = totalCells - 1; let shuffleSteps = this.gridSize === 3 ? 20 : (this.gridSize === 5 ? 60 : 40);
              for (let k = 0; k < shuffleSteps; k++) { let r = Math.floor(emptyIndex / this.gridSize), c = emptyIndex % this.gridSize; let validMoves = []; if (r > 0) validMoves.push(emptyIndex - this.gridSize); if (r < this.gridSize - 1) validMoves.push(emptyIndex + this.gridSize); if (c > 0) validMoves.push(emptyIndex - 1); if (c < this.gridSize - 1) validMoves.push(emptyIndex + 1); let nextMove = validMoves[Math.floor(Math.random() * validMoves.length)]; arr[emptyIndex] = arr[nextMove]; arr[nextMove] = 0; this.movesHistory.push(emptyIndex); emptyIndex = nextMove; }
              this.gameMatrix = arr;
            },
            startTimer() { if (!this.timerId) { this.timerId = setInterval(() => { this.timerSeconds++; }, 1000); } },
            stopTimer() { if (this.timerId) { clearInterval(this.timerId); this.timerId = null; } },
            moveTile(index) { if (this.isWin) return; let emptyIndex = this.gameMatrix.indexOf(0); if ((Math.abs(Math.floor(index/this.gridSize) - Math.floor(emptyIndex/this.gridSize)) + Math.abs((index%this.gridSize) - (emptyIndex%this.gridSize))) === 1) { if (this.moves === 0 && !this.autoPlaying) this.startTimer(); let newBoard = [...this.gameMatrix]; newBoard[emptyIndex] = newBoard[index]; newBoard[index] = 0; this.gameMatrix = newBoard; this.moves++; this.triggerVibe('short'); this.checkWin(); } },
            checkWin() { let totalCells = this.gridSize * this.gridSize; for (let i = 0; i < totalCells - 1; i++) { if (this.gameMatrix[i] !== i + 1) return; } this.isWon = true; this.stopTimer(); this.stopAutoRun(); this.triggerVibe('long'); if (this.moves > 0) this.saveRecord(); },
            toggleAutoRun() { if (this.autoPlaying) { this.stopAutoRun(); } else { this.autoPlaying = true; this.startTimer(); this.autoTimerId = setInterval(() => { this.makeAutoMove(); }, 450); } },
            stopAutoRun() { this.autoPlaying = false; if (this.autoTimerId) { clearInterval(this.autoTimerId); this.autoTimerId = null; } },makeAutoMove() { if (this.isWin || this.movesHistory.length === 0) { this.stopAutoRun(); return; } let targetEmptyIndex = this.movesHistory.pop(); let currentEmptyIndex = this.gameMatrix.indexOf(0); let newBoard = [...this.gameMatrix]; newBoard[currentEmptyIndex] = newBoard[targetEmptyIndex]; newBoard[targetEmptyIndex] = 0; this.gameMatrix = newBoard; this.moves++; this.triggerVibe('short'); this.checkWin(); },
cycleGridSize() { this.gridSize = this.gridSize === 5 ? 3 : this.gridSize + 1; this.loadRecords(); this.restartGame(); },
toMenu() { this.showSettings = true; this.triggerVibe('short'); },
toGame() { this.showSettings = false; this.triggerVibe('short'); },
toggleTheme() { this.isDark = !this.isDark; this.triggerVibe('short'); },
toggleColor() { this.tileStyle = this.tileStyle === 0 ? 1 : 0; this.triggerVibe('short'); },
toggleVib() { this.isVib = !this.isVib; this.triggerVibe('short'); },
triggerVibe(mode) { if (this.isVib) { try { vibrator.vibrate({ mode: mode }); } catch(e){} } },
saveRecord() {
storage.get({ key: bm_${this.gridSize}, success: (data) => { if (!data || this.moves < parseInt(data)) { storage.set({ key: bm_${this.gridSize}, value: this.moves.toString() }); this.bestMoves = this.moves; } } });
storage.get({ key: bt_${this.gridSize}, success: (data) => { if (!data || this.timerSeconds < parseInt(data)) { storage.set({ key: bt_${this.gridSize}, value: this.timerSeconds.toString() }); this.bestTime = this.timerSeconds; } } });
},
loadRecords() {
storage.get({ key: bm_${this.gridSize}, success: (data) => { this.bestMoves = data || '-'; } });
storage.get({ key: bt_${this.gridSize}, success: (data) => { this.bestTime = data || '-'; } });
}
}

EOF
- name: Build RPK
run: npm install; mkdir -p sign/release; openssl req -x509 -nodes -days 3650 -newkey rsa:2048 -keyout sign/release/private.pem -out sign/release/certificate.pem -subj "/CN=localhost"; npx aiot release; mkdir -p dist_output; find dist/ -name ".rpk" -not -path "/node_modules/*" -exec cp {} dist_output/remaster.rpk ;
