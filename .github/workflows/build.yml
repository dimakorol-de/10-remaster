name: Build RPK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Hard Reset Cache
        run: |
          echo "Полная очистка кэша..."
          rm -rf ~/.npm node_modules dist build src/pages/index
          mkdir -p src/common src/pages/index
          
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate High-Quality Icon
        run: |
          pip install Pillow
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGBA', (192, 192), (0, 110, 245, 255))
          draw = ImageDraw.Draw(img)
          mask = Image.new('L', (192, 192), 0)
          mask_draw = ImageDraw.Draw(mask)
          mask_draw.rounded_rectangle([(0, 0), (192, 192)], radius=45, fill=255)
          img.putalpha(mask)
          draw.text((96, 93), '15', fill=(255, 255, 255, 255), anchor='mm', font_size=85, font_style='bold')
          img.save('src/common/icon.png')
          "
          echo "Иконка icon.png создана успешно!"

      - name: Inject Safe App Code (True Application Mode)
        run: |
          # 1. Манифест полноценного приложения com.soldatov.fifteen
          cat << 'EOF' > src/manifest.json
          {
            "package": "com.soldatov.fifteen",
            "name": "Пятнашки",
            "versionName": "1.0.0",
            "versionCode": 1,
            "minPlatformVersion": 1000,
            "icon": "/common/icon.png",
            "deviceTypeList": ["band"],
            "config": {
              "logLevel": "log",
              "designWidth": 212
            },
            "router": {
              "entry": "pages/index",
              "pages": {
                "pages/index": {
                  "component": "index"
                }
              }
            }
          }
          EOF

          # 2. Чистая UX-разметка БЕЗ тега <script> (Ломает флаг component: true!)
          cat << 'EOF' > src/pages/index/index.ux
          <template>
            <div class="container">
              <text class="title">Пятнашки 4x4</text>
              <div class="board">
                <div class="cell-wrapper"><input type="button" class="cell" value="1" /></div>
                <div class="cell-wrapper"><input type="button" class="cell" value="2" /></div>
                <div class="cell-wrapper"><input type="button" class="cell" value="3" /></div>
                <div class="cell-wrapper"><input type="button" class="cell" value="4" /></div>
                <div class="cell-wrapper"><input type="button" class="cell" value="5" /></div>
                <div class="cell-wrapper"><input type="button" class="cell" value="6" /></div>
                <div class="cell-wrapper"><input type="button" class="cell" value="7" /></div>
                <div class="cell-wrapper"><input type="button" class="cell" value="8" /></div>
                <div class="cell-wrapper"><input type="button" class="cell" value="9" /></div>
                <div class="cell-wrapper"><input type="button" class="cell" value="10" /></div>
                <div class="cell-wrapper"><input type="button" class="cell" value="11" /></div>
                <div class="cell-wrapper"><input type="button" class="cell" value="12" /></div>
                <div class="cell-wrapper"><input type="button" class="cell" value="13" /></div>
                <div class="cell-wrapper"><input type="button" class="cell" value="14" /></div>
                <div class="cell-wrapper"><input type="button" class="cell" value="15" /></div>
              </div>
              <text class="author">Создал Александр Солдатов</text>
            </div>
          </template>

          <style>
            .container { flex-direction: column; align-items: center; width: 212px; background-color: #000000; padding-top: 30px; padding-bottom: 30px; }
            .title { font-size: 22px; color: #FFFFFF; margin-bottom: 20px; font-weight: bold; }
            .board { width: 184px; flex-wrap: wrap; justify-content: center; margin-bottom: 25px; }
            .cell-wrapper { width: 43px; height: 43px; margin: 1.5px; justify-content: center; align-items: center; }
            .cell { width: 43px; height: 43px; border-radius: 6px; font-size: 18px; font-weight: bold; background-color: #007AFF; color: #FFFFFF; }
            .author { font-size: 14px; color: #FFD700; margin-top: 15px; font-weight: bold; }
          </style>
          EOF
          echo "Интерфейс полноценного приложения зашит!"

      - name: Install and Build (Release Mode)
        run: |
          echo '{"name":"fifteen","version":"1.0.0","devDependencies":{"aiot-toolkit":"2.0.5"}}' > package.json
          npm install
          mkdir -p sign/release
          openssl req -x509 -nodes -days 3650 -newkey rsa:2048 -keyout sign/release/private.pem -out sign/release/certificate.pem -subj "/CN=localhost"
          npx aiot-toolkit release
          mkdir -p dist_output
          find dist/ -name "*.rpk" -not -path "*/node_modules/*" -exec cp {} dist_output/remaster.rpk \;
          
      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: dist_output/remaster.rpk
