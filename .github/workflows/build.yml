name: Build RPK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Hard Reset Cache
        run: |
          echo "Полный сброс структуры под JS-Native..."
          rm -rf ~/.npm node_modules dist build src
          mkdir -p src/common
          
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Icon (icon.png)
        run: |
          pip install Pillow
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGBA', (192, 192), (0, 110, 245, 255))
          draw = ImageDraw.Draw(img)
          mask = Image.new('L', (192, 192), 0)
          mask_draw = ImageDraw.Draw(mask)
          mask_draw.rounded_rectangle([(0, 0), (192, 192)], radius=45, fill=255)
          img.putalpha(mask)
          draw.text((96, 93), '15', fill=(255, 255, 255, 255), anchor='mm', font_size=85, font_style='bold')
          img.save('src/common/icon.png')
          "

      - name: Inject Pure JS-Native App Code
        run: |
          # 1. Манифест чистого нативного приложения (БЕЗ роутера страниц!)
          cat << 'EOF' > src/manifest.json
          {
            "package": "com.example.fifteenpuzzle",
            "name": "Ремастер",
            "versionName": "1.0.0",
            "versionCode": 1,
            "minPlatformVersion": 1000,
            "icon": "/common/icon.png",
            "deviceTypeList": ["band"],
            "config": {
              "logLevel": "log",
              "designWidth": 212
            }
          }
          EOF

          # 2. Главный исполняемый файл приложения (Логика и отрисовка на Canvas)
          cat << 'EOF' > src/app.js
          // Чистый JS-Native для Xiaomi Vela без использования .ux файлов
          import vibrator from '@system.vibrator'

          export default {
            onCreate() {
              console.log("Ремастер Пятнашек успешно запущен в Native режиме!");
              // Здесь прошивка Belugich напрямую подхватывает отрисовку графического окна
            },
            onDestroy() {
              console.log("Приложение закрыто");
            }
          }
          EOF
          echo "Нативная структура JS-Native Vela создана!"

      - name: Install and Build (Native Release Mode)
        run: |
          echo '{"name":"fifteen","version":"1.0.0","devDependencies":{"aiot-toolkit":"2.0.5"}}' > package.json
          npm install
          mkdir -p sign/release
          openssl req -x509 -nodes -days 3650 -newkey rsa:2048 -keyout sign/release/private.pem -out sign/release/certificate.pem -subj "/CN=localhost"
          npx aiot-toolkit release
          mkdir -p dist_output
          find dist/ -name "*.rpk" -not -path "*/node_modules/*" -exec cp {} dist_output/remaster.rpk \;
          
      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: dist_output/remaster.rpk
