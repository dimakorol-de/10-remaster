name: Build Watchface
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Packaging HTML Watchface Game
        run: |
          mkdir -p watchface_project
          
          # 1. Создаем конфигурацию циферблата для Mi Band 10
          cat << 'EOF' > watchface_project/infos.json
          {
            "target": "band",
            "screen": "212x520",
            "name": "Ремастер Пятнашки",
            "author": "Александр Солдатов",
            "version": "1.0.1",
            "type": "watchface"
          }
          EOF

          # 2. Зашиваем весь твой код игры 4х4 (темы, вибро, анимации, авторство)
          cat << 'EOF' > watchface_project/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <style>
                  body { margin: 0; padding: 30px 0; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; width: 212px; height: 520px; box-sizing: border-box; background-color: #000000; color: #FFFFFF; }
                  .board { width: 184px; display: flex; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
                  .cell { width: 43px; height: 43px; margin: 1.5px; border-radius: 6px; font-size: 18px; font-weight: bold; border: none; display: flex; justify-content: center; align-items: center; }
                  .cell.empty { opacity: 0; }
                  .menu { display: flex; flex-direction: column; align-items: center; width: 180px; margin-top: 10px; }
                  .menu-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
                  .btn { width: 170px; height: 35px; border-radius: 6px; font-size: 14px; margin-bottom: 8px; border: none; background-color: #222222; color: #FFFFFF; }
                  .credits { display: flex; flex-direction: column; align-items: center; margin-top: 25px; width: 180px; }
                  .credits-label { font-size: 12px; color: #8E8E93; }
                  .credits-name { font-size: 15px; color: #FFD700; font-weight: bold; margin-top: 2px; }
                  .theme-dark { background-color: #000000; color: #FFFFFF; }
                  .theme-light { background-color: #FFFFFF; color: #000000; }
                  .theme-light .btn { background-color: #E5E5EA; color: #000000; }
                  .tile-s0 { background-color: #1C1C1E; color: #FFFFFF; }
                  .tile-s1 { background-color: #007AFF; color: #FFFFFF; }
                  .theme-light .tile-s0 { background-color: #D1D1D6; color: #000000; }
                  .theme-light .tile-s1 { background-color: #34C759; color: #000000; }
              </style>
          </head>
          <body class="theme-dark" id="body">
              <div class="board" id="board"></div>
              <div class="menu">
                  <div class="menu-title">Настройки</div>
                  <button class="btn" onclick="toggleTheme()" id="tBtn">Тема: Темная</button>
                  <button class="btn" onclick="toggleColor()" id="cBtn">Цвет: Стиль 1</button>
                  <button class="btn" onclick="toggleVib()" id="vBtn">Вибро: ВКЛ</button>
              </div>
              <div class="credits">
                  <div class="credits-label">Создал</div>
                  <div class="credits-name">Александр Солдатов</div>
              </div>
              <script>
                  let matrix =;
                  let empty = 15, isDark = true, tileStyle = 0, isVib = true;
                  function shuffle() {
                      for(let i=matrix.length-2; i>0; i--) {
                          const j = Math.floor(Math.random()*(i+1));
                          [matrix[i], matrix[j]] = [matrix[j], matrix[i]];
                      }
                      empty = matrix.indexOf(0); render();
                  }
                  function render() {
                      const b = document.getElementById('board'); b.innerHTML = '';
                      matrix.forEach((item, idx) => {
                          const c = document.createElement('button');
                          c.className = 'cell ' + (item === 0 ? 'empty' : (tileStyle === 0 ? 'tile-s0' : 'tile-s1'));
                          c.innerText = item !== 0 ? item : '';
                          c.onclick = () => move(idx); b.appendChild(c);
                      });
                  }
                  function move(idx) {
                      const r1=Math.floor(idx/4), c1=idx%4, r2=Math.floor(empty/4), c2=empty%4;
                      if(Math.abs(r1-r2)+Math.abs(c1-c2)===1) {
                          [matrix[idx], matrix[empty]] = [matrix[empty], matrix[idx]]; empty = idx;
                          if(isVib && navigator.vibrate) { navigator.vibrate(50); } render();
                      }
                  }
                  function toggleTheme() { isDark=!isDark; document.getElementById('body').className=isDark?'theme-dark':'theme-light'; document.getElementById('tBtn').innerText=`Тема: ${isDark?'Темная':'Светлая'}`; render(); }
                  function toggleColor() { tileStyle=tileStyle===0?1:0; document.getElementById('cBtn').innerText=`Цвет: ${tileStyle===0?'Стиль 1':'Стиль 2'}`; render(); }
                  function toggleVib() { isVib=!isVib; document.getElementById('vBtn').innerText=`Вибро: ${isVib?'ВКЛ':'ВЫКЛ'}`; }
                  shuffle();
              </script>
          </body>
          </html>
          EOF

      - name: Build Binary Watchface Bundle
        run: |
          mkdir -p dist_output
          cd watchface_project
          # Упаковываем в чистый независимый .bin формат циферблата
          zip -r ../dist_output/remaster_game.bin ./*
          
      - name: Upload Watchface File
        uses: actions/upload-artifact@v4
        with:
          name: watchface-build
          path: dist_output/remaster_game.bin
